[output]
dir = "outputs/exp3_ibw_capacity"

[reference]
dir = "outputs/exp3_ibw_initialization/reference_h1"
discovery_samples = 64

[teacher_eval]
n_samples = 256
rollout_seed_base = 41000
batch_size = 16
baseline_group_size = 128
baseline_repeats = 10

[experiment]
device = "cuda"
feature_device = "same"
batch_size = 16
n_eval = 128
n_perm = 500
n_projections = 256
trace_every = 10
collapse_threshold = 1.0
teacher_cluster_seed = 0

# Stage 1 deliberately changes only K and initialization.  BG is held at the
# previous experiment's value (4); the best settings become the smaller input
# to the BG={16,64}, iteration, and step-size follow-up rather than paying for
# the full Cartesian product up front.
[[runs]]
stage = "screen"
init = "standard"
k = [1, 2, 4, 8, 16]
bg = [4]
seeds = [11]
iterations = [300]
step_sizes = [0.1]

[[runs]]
stage = "screen"
init = "teacher"
k = [1, 2, 4, 8, 16]
bg = [4]
seeds = [11]
iterations = [300]
step_sizes = [0.1]

# Stage 2a: repeat a promising intermediate-cost setting across optimization
# and evaluation seeds.  Running this first gives a variance estimate before
# the more expensive trajectory diagnostics.
[[runs]]
stage = "seed_repeat"
init = "teacher"
k = [4]
bg = [16]
seeds = [11, 29, 47]
iterations = [300]
step_sizes = [0.1]

# Stage 2b: distinguish an iteration plateau from a step-size/discretization
# effect at K=8.  The two smaller-step runs keep approximately the same or a
# longer optimization horizon than the original 300 x 0.1 fit.
[[runs]]
stage = "optimization"
init = "teacher"
k = [8]
bg = [4]
seeds = [11]
iterations = [1000]
step_sizes = [0.1, 0.03, 0.01]

# Stage 2c: finish the requested BG sweep at K=4, the cost-normalized screen
# winner (within 0.0042 MMD² of K=8 at half the runtime).  K=16 is excluded
# because it was worse than K=8 in the screen and is not promising.
[[runs]]
stage = "bg_sweep"
init = "teacher"
k = [4]
bg = [64]
seeds = [11]
iterations = [300]
step_sizes = [0.1]

# Stage 3: map the small-step trajectory around the unexpectedly best
# optimization horizon.  The completed 1000-step point is reused.
[[runs]]
stage = "early_stopping"
init = "teacher"
k = [8]
bg = [4]
seeds = [11]
iterations = [50, 100, 200, 300, 400, 600]
step_sizes = [0.01]

# Repeat the best point found by the common-seed early-stopping sweep to
# separate optimization/evaluation noise from the large initialization gain.
[[runs]]
stage = "best_repeat"
init = "teacher"
k = [8]
bg = [4]
seeds = [29, 47]
iterations = [400]
step_sizes = [0.01]
